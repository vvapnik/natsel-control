<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>natsel · control</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main id="login" class="login" hidden>
  <form id="login-form" class="card">
    <h1>natsel <span>control</span></h1>
    <label>Login <input name="login" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<div id="app" hidden>
  <header class="bar">
    <strong>natsel <span>control</span></strong>
    <nav>
      <a href="#populations">Populations</a>
      <a href="#pool">Gene pool</a>
      <a href="#species">Species</a>
    </nav>
    <span class="spacer"></span>
    <span id="who"></span>
    <button id="logout" class="ghost">Sign out</button>
  </header>
  <main id="view" class="content"></main>
  <div id="toast" role="status"></div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
